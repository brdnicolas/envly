# Yarn 4 (Berry). The binary is committed in .yarn/releases, so `yarn` works with any global Yarn
# (or with Corepack: `corepack enable`). See docs/contributing.md.
yarnPath: .yarn/releases/yarn-4.10.3.cjs

# Classic node_modules folders: required by Expo/React Native (CocoaPods autolinking) and Next.js.
nodeLinker: node-modules

enableTelemetry: false
